<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>下课开麦 · 返课之前，安排一顿</title><meta name="description" content="CampusMcD 交互演示：模拟预算与返课时间比较，不连接会员账户。"><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"><script defer src="demo-data.js"></script><script defer src="demo.js"></script></head><body><main><header><a href="index.html">下课开麦<small>CampusMcD</small></a><span class="badge">模拟数据 · 零账户演示</span></header><section class="intro"><p>有些决定，得在下课铃响后做完。</p><h1>还剩 40 分钟，<br>这一顿来得及吗？</h1><p>把预算、往返路程和返课缓冲放在一起算。<br>选一个课间，看看三种不同的安排。</p><p class="muted">40 组模拟状态由 Python 决策内核预先计算。所有餐品、价格、券及耗时均为虚构。页面不接收位置或 Token。</p></section><div class="presets" aria-label="演示场景"><button type="button" data-scene="25-90-0">午休 90 分钟 / 25 元</button><button type="button" data-scene="25-25-0">课间 25 分钟 / 不勉强赶</button><button type="button" data-scene="25-40-1">鸡肉偏好 / 700 千卡内</button></div><form id="settings" class="controls"><label>可支配预算<select id="budget" name="budget"><option value="10">¥10</option><option value="15">¥15</option><option value="20">¥20</option><option value="25" selected>¥25</option><option value="30">¥30</option></select></label><label>下课到返课<select id="minutes" name="minutes"><option value="25">25 分钟</option><option value="40" selected>40 分钟</option><option value="60">60 分钟</option><option value="90">90 分钟</option></select></label><label>饮食偏好<select id="chicken" name="chicken"><option value="0">不限（模拟）</option><option value="1">鸡肉 / ≤700 千卡</option></select></label><button type="submit">生成我的课间报告</button></form><p id="status" role="status" aria-live="polite"></p><div id="report"></div><button id="print" type="button">打印报告 / 保存 PDF</button><p class="muted">分享前请确认内容。示例不含真实地点、会员信息或官方商标。<span>安装与实时使用方法见仓库 README。另有 <a href="live-example.html" style="font-size:inherit">2026-10-24脱敏历史核价报告</a>，非当前报价。</span></p><noscript>此演示需要 JavaScript，也可打开 <a href="example-report.html">静态模拟报告</a>。</noscript></main></body></html>
